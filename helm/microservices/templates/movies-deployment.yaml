apiVersion: apps/v1
kind: Deployment

metadata:
  name: movies
  namespace: microservices

spec:
  replicas: 2

  selector:
    matchLabels:
      app: movies

  template:
    metadata:
      labels:
        app: movies

    spec:
      affinity:
        podAntiAffinity:
  
          preferredDuringSchedulingIgnoredDuringExecution:
  
            - weight: 100
  
              podAffinityTerm:
  
                labelSelector:
  
                  matchExpressions:
  
                    - key: app
  
                      operator: In
  
                      values:
                        - movies
  
                topologyKey: kubernetes.io/hostname
      containers:
        - name: movies
          image: kube-microservices:latest
          imagePullPolicy: IfNotPresent

          command:
            - /app/movies

          ports:
            - containerPort: 8080

          resources:
            {{- toYaml .Values.movies.resources | nindent 12 }}