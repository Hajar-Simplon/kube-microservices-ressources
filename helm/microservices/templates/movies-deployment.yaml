apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-movies
  namespace: {{ .Values.namespace | default .Release.Namespace }}

spec:
  replicas: {{ .Values.movies.replicaCount }}

  selector:
    matchLabels:
      app: movies

  template:
    metadata:
      labels:
        app: movies

    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - movies
                topologyKey: {{ .Values.global.topologyKey }}
      
      containers:
        - name: movies
          image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}

          command:
            {{- toYaml .Values.movies.command | nindent 12 }}

          ports:
            - containerPort: {{ .Values.movies.service.targetPort }}

          {{- with .Values.movies.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.movies.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.movies.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.movies.resources | nindent 12 }}