apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.api.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - api
              topologyKey: kubernetes.io/hostname

      containers:
        - name: api

          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          command:
            - /app/api

          env:
            - name: BOOKS_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: BOOKS_API_HOST

            - name: MOVIES_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: MOVIES_API_HOST

          ports:
            - containerPort: {{ .Values.api.containerPort }}

          startupProbe:
            httpGet:
              path: {{ .Values.api.startupProbe.path }}
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: {{ .Values.api.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessProbe.path }}
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessProbe.path }}
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}

          resources:
{{- toYaml .Values.api.resources | nindent 12 }}