apiVersion: v1
kind: Service

metadata:
  name: api-service
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    app: api

  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      {{- with .Values.api.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}

  type: {{ .Values.api.service.type }}
