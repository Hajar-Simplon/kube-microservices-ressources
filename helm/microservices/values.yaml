namespace: microservices

api:
  replicas: 2

  image:
    repository: kube-microservices
    tag: latest
    pullPolicy: IfNotPresent

  containerPort: 8080

  service:
    type: NodePort
    port: 80
    targetPort: 8080

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"

    limits:
      cpu: "250m"
      memory: "256Mi"

  startupProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30

  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

  livenessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20