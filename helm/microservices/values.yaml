global:
  image:
    repository: kube-microservices
    pullPolicy: IfNotPresent
    tag: latest

  # Topology key for pod anti-affinity. This is used to ensure that pods are scheduled on different nodes. More information can be found here: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  topologyKey: kubernetes.io/hostname


-commonProbes: &commonAppConfig
  replicaCount: 3

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    failureThreshold: 1
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 10
  # This is to setup the startup probe more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  startupProbe:
    httpGet:
      path: /health
      port: 8080
    failureThreshold: 30
    periodSeconds: 10

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080


  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"

books:
  <<: *commonAppConfig
  command: ["/app/books"]

movies:
  <<: *commonAppConfig
  command: ["/app/movies"]


  





